[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-ir-data-tools"
version = "0.1.0"
description = "Readers and corrections for Kaguya/SELENE Spectral Profiler and Multiband Imager data and Chandrayaan-2 IIRS data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adomas Valantinas" }]
keywords = ["Moon", "Kaguya", "SELENE", "Spectral Profiler", "Multiband Imager",
            "Chandrayaan-2", "IIRS", "reflectance", "thermal correction", "PDS3", "PDS4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "requests>=2.28",
]

[project.optional-dependencies]
mi = ["rasterio>=1.3"]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/euchas/lunar-ir-data-tools"
Repository = "https://github.com/euchas/lunar-ir-data-tools"
Issues = "https://github.com/euchas/lunar-ir-data-tools/issues"
Changelog = "https://github.com/euchas/lunar-ir-data-tools/blob/main/CHANGELOG.md"

[project.scripts]
lunar-ir-tools = "lunar_ir_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
